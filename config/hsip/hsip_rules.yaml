# HSIP work code tagging rules
#
# One rule per TxDOT HSIP work code. Each produces a 0/1 column,
# HSIP_<id>, on every crash: 1 means this countermeasure is one that could
# plausibly have addressed that crash. The app uses those flags to work out how
# many crashes at a site a given countermeasure is credited against, which
# becomes the benefit term in the SII calculation. So a rule that is too broad
# inflates a countermeasure's benefit and a rule that is too narrow buries it.
#
# Rule ids are bare work codes; the pipeline adds the HSIP_ prefix.
#
# The ids must correspond exactly, one-to-one, with the `Work Code` column of
# countermeasures.csv, because that CSV is what the build derives the flag
# column list from (tools/data-build/config.py, derive_hsip_fields). Neither
# half of a mismatch raises anything: a rule with no CSV row computes a column
# nothing reads, and a CSV row with no rule leaves a countermeasure whose flag
# is 0 for every crash, which the app reads as "addresses nothing" and quietly
# scores at zero benefit. Add or remove a work code in both files together.
#
#
# How to read a rule
#
# Ids and labels aside, a rule is one or more `paths`. Each path names a CRIS
# table and a condition to evaluate against it:
#
#   - table: crash | unit | person
#     condition: <condition>
#     aggregate: any            # only for unit/person; see below
#
# `crash` has one row per crash, so a condition on it is already a per-crash
# answer and needs no aggregate. `unit` and `person` have many rows per crash
# (one per vehicle, one per occupant), so those paths need `aggregate: any`,
# meaning "1 if any row for this crash matches". Nearly every rule here is a
# single `crash` path; only a handful reach for `unit`.
#
# Conditions are a tree. Leaves test one field, branches combine them:
#
#   field: <CRIS column>        with one of
#     in: [1, 2, 3]             value is in the list
#     not_in: [1, 2]            value is present AND not in the list
#     range: [10, 20]           value is between the bounds, inclusive
#   and: [<condition>, ...]     every child must match
#   or:  [<condition>, ...]     any child must match
#
# Rule 101 below reads: flag the crash if its first-harmful-event code is one
# of 20, 21, 22, 30, or its road-relation code is one of 2, 3, 4.
#
# Two things about matching that are easy to get wrong. Values are compared
# numerically, so CRIS codes go in unquoted. And `not_in` is not the negation
# of `in`: it requires the field to have a value, so a crash with a blank field
# matches neither `in: [1]` nor `not_in: [1]`.
#
#
# The gotcha worth knowing
#
# A misspelled field name does not fail. It evaluates to false for every row,
# so the work code ends up flagged on zero crashes and the countermeasure
# silently scores no benefit for anyone. Nothing in the build or the app will
# tell you. Copy field names exactly from the CRIS extract specification
# (input_data/cris_export/public-extract-file-specification.xlsx), and after
# editing a rule, check that its flag count is not zero.
#
#
# Two less common shapes, both used below
#
# `match_all: true` replaces `paths` entirely and flags every crash. It is for
# countermeasures whose applicability is not a function of crash attributes at
# all — see 111, 114, 133, 220. It means "do not filter", not "applies to
# everything", and the narrowing happens when a user picks a site.
#
# Multiple paths combine with the rule's `combine` (`or` by default, or `and`),
# and a path may instead be a `group` with its own nested `paths` and
# `combine`. Rule 524 is the only rule here that uses either.
#
# The condition language is shared with ea_rules.yaml and implemented in
# tools/data-build/crash_prep/tag_engine.py, which is authoritative if this
# summary and the code ever disagree.

