# The only rule using a nested group, and the only one whose paths combine with
# anything other than the default `or`. It reads: flag the crash if (a large
# vehicle was involved AND the harmful event was code 7), OR the collision type
# was 13, 20, or 21. The inner `combine: and` applies only within the group;
# the group's result then ors with the path that follows it.
- id: 524
  label: Increase Turning Radius
  paths:
  - group:
      combine: and
      paths:
      - table: unit
        aggregate: any
        condition:
          field: Veh_Body_Styl_ID
          in:
          - 87
          - 102
      - table: crash
        condition:
          field: Harm_Evnt_ID
          in:
          - 7
  - table: crash
    condition:
      field: FHE_Collsn_ID
      in:
      - 13
      - 20
      - 21
      - 30
      - 33
  combine: or
